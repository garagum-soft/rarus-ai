[project]
name = "rarus-app"
version = "0.1.0"
description = "Rarus AI desktop shell: window, tray, engine launcher, sign-in bridge, updates"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
gui = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10.0"]

[project.scripts]
rarus-app = "rarus_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rarus_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
