[project]
name = "rarus-app"
version = "0.1.1"
description = "Rarus AI desktop shell: window, tray, engine launcher, sign-in bridge, updates"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
gui = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10.0"]

[project.scripts]
rarus-app = "rarus_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rarus_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["C901", "E", "F", "I", "N", "W", "S101", "S105", "S106", "S107", "S506", "S605", "S607"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E741", "F811", "F841", "N802", "N805", "N806", "S101", "S105", "S106", "S107", "S607"]
