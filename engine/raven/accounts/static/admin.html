<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raven · Admin</title>
<link rel="stylesheet" href="/_hub/static/hub.css" />
</head>
<body>
<div class="hub-wide">
  <div class="hub-row" style="justify-content: space-between">
    <h1 data-i18n="admin">Admin</h1>
    <div class="hub-row"><a href="/" data-i18n="back">Back to Raven</a><a href="/_hub/account" data-i18n="account">Account</a></div>
  </div>
  <p class="hub-note" data-i18n="securityNote"></p>
  <nav class="hub-tabs" role="tablist">
    <button type="button" data-tab="accounts" data-i18n="accounts">Accounts</button>
    <button type="button" data-tab="prices" data-i18n="prices">Prices</button>
    <button type="button" data-tab="settings" data-i18n="settings">Settings</button>
    <button type="button" data-tab="audit" data-i18n="audit">Audit</button>
    <button type="button" data-tab="ledger" data-i18n="ledger">Ledger</button>
  </nav>
  <div class="hub-error" id="error" role="alert"></div>

  <section id="tab-accounts" class="hub-panel" hidden>
    <div class="hub-scroll"><table>
      <thead><tr><th data-i18n="username">Username</th><th data-i18n="role">Role</th><th class="hub-num" data-i18n="balance">Balance</th><th class="hub-num" data-i18n="disk">Disk</th><th data-i18n="engine">Engine</th><th data-i18n="lent">Lent access</th><th></th></tr></thead>
      <tbody id="accounts"></tbody>
    </table></div>
    <details style="margin-top: 16px"><summary data-i18n="newAccount">New account</summary>
      <form id="create-form" class="hub-row" style="margin-top: 8px">
        <input id="c-user" data-i18n-placeholder="username" required style="max-width: 200px" />
        <input id="c-pass" type="password" data-i18n-placeholder="password" minlength="8" style="max-width: 200px" />
        <select id="c-role" style="max-width: 140px"><option value="user">user</option><option value="admin">admin</option></select>
        <button class="hub-primary" type="submit" data-i18n="create">Create</button>
      </form>
    </details>
  </section>

  <section id="tab-prices" class="hub-panel" hidden>
    <p class="hub-muted"><span data-i18n="perMillion"></span>. <span data-i18n="pricesNote"></span></p>
    <div class="hub-scroll"><table>
      <thead><tr><th data-i18n="model">Model</th><th data-i18n="input">Input</th><th data-i18n="output">Output</th><th data-i18n="cacheHit">Cache hit</th><th></th></tr></thead>
      <tbody id="prices"></tbody>
      <tfoot><tr>
        <td><input id="n-model" placeholder="anthropic/claude-sonnet-4-5" /></td>
        <td><input id="n-in" type="number" step="any" min="0" /></td>
        <td><input id="n-out" type="number" step="any" min="0" /></td>
        <td><input id="n-hit" type="number" step="any" min="0" /></td>
        <td><button type="button" id="add-price" data-i18n="add">Add</button></td>
      </tr></tfoot>
    </table></div>
    <p class="hub-muted" id="unpriced"></p>
    <form id="rate-form" style="max-width: 420px">
      <label for="r-rate" data-i18n="creditsPerUsd"></label><input id="r-rate" type="number" step="any" min="0" />
      <label for="r-own" data-i18n="ownShare"></label><input id="r-own" type="number" step="any" min="0" max="1" />
      <label for="r-lent" data-i18n="lentShare"></label><input id="r-lent" type="number" step="any" min="0" />
      <div class="hub-actions"><button class="hub-primary" type="submit" data-i18n="save">Save</button></div>
    </form>
  </section>

  <section id="tab-settings" class="hub-panel" hidden>
    <form id="settings-form" style="max-width: 560px">
      <label for="s-url" data-i18n="publicUrl"></label><input id="s-url" placeholder="https://raven.example.com" />
      <label class="hub-row"><input id="s-open" type="checkbox" /> <span data-i18n="registrationOpen"></span></label>
      <label for="s-gid" data-i18n="googleId"></label><input id="s-gid" />
      <label for="s-gsecret" data-i18n="googleSecret"></label><input id="s-gsecret" type="password" autocomplete="off" />
      <p class="hub-muted"><span data-i18n="googleRedirect"></span> <code id="s-redirect"></code></p>
      <label for="s-disk" data-i18n="diskQuota"></label><input id="s-disk" type="number" step="any" min="1" />
      <label for="s-new" data-i18n="newCredits"></label><input id="s-new" type="number" step="any" min="0" />
      <div class="hub-actions"><button class="hub-primary" type="submit" data-i18n="save">Save</button></div>
    </form>
  </section>

  <section id="tab-audit" class="hub-panel" hidden>
    <div class="hub-scroll"><table><thead><tr><th data-i18n="when">When</th><th>Actor</th><th data-i18n="what">What</th><th>Target</th><th></th></tr></thead><tbody id="audit"></tbody></table></div>
  </section>

  <section id="tab-ledger" class="hub-panel" hidden>
    <select id="ledger-account" style="max-width: 260px; margin-bottom: 12px"></select>
    <div class="hub-scroll"><table><thead><tr><th data-i18n="when">When</th><th data-i18n="account">Account</th><th data-i18n="what">What</th><th class="hub-num" data-i18n="credits">credits</th><th class="hub-num" data-i18n="balance">Balance</th></tr></thead><tbody id="ledger"></tbody></table></div>
  </section>
</div>
<script src="/_hub/static/hub.js"></script>
<script>
(function () {
  "use strict";
  var H = window.RavenHub, esc = H.esc;
  var $ = function (id) { return document.getElementById(id); };
  var state = { me: null, accounts: [], permissions: {}, lendable: [] };
  function fail(error) {
    if (error.status === 401) { window.location.href = "/_hub/login"; return; }
    $("error").textContent = error.message || String(error);
  }
  function ok() { $("error").innerHTML = '<span class="hub-ok">' + H.t("saved") + "</span>"; }
  function names() { var m = {}; state.accounts.forEach(function (a) { m[a.id] = a.username; }); return m; }

  function renderAccounts() {
    var superadmin = state.me && state.me.role === "superadmin";
    $("accounts").innerHTML = state.accounts.map(function (a) {
      var perms = a.role === "admin" ? a.permissions.map(function (p) { return '<span class="hub-tag">' + esc(p) + "</span>"; }).join("") : "";
      var lent = state.lendable.map(function (p) {
        return '<label class="hub-row" style="margin:0"><input type="checkbox" data-lend="' + esc(a.id) + '" value="' + esc(p) + '"' +
          (a.lent.indexOf(p) >= 0 ? " checked" : "") + (a.server_home ? " disabled" : "") + "> " + esc(p) + "</label>";
      }).join("");
      var roleCell = esc(a.role) + (a.disabled ? ' <span class="hub-tag hub-bad">off</span>' : "") +
        (a.blocked ? ' <span class="hub-tag hub-bad" title="' + esc(a.blocked) + '">' + H.t("blocked") + "</span>" : "") + "<br>" + perms;
      if (superadmin && a.role !== "superadmin") {
        roleCell += '<details><summary>' + H.t("permissions") + '</summary><select data-role="' + esc(a.id) + '"><option value="user"' +
          (a.role === "user" ? " selected" : "") + '>user</option><option value="admin"' + (a.role === "admin" ? " selected" : "") + ">admin</option></select>" +
          Object.keys(state.permissions).map(function (p) {
            return '<label class="hub-row" style="margin:2px 0" title="' + esc(state.permissions[p]) + '"><input type="checkbox" data-perm="' + esc(a.id) +
              '" value="' + esc(p) + '"' + (a.permissions.indexOf(p) >= 0 ? " checked" : "") + "> " + esc(p) + "</label>";
          }).join("") + '<button type="button" data-save-role="' + esc(a.id) + '">' + H.t("save") + "</button></details>";
      }
      return "<tr><td><b>" + esc(a.username) + "</b><br><span class=\"hub-muted\">" + esc(a.email || "") + "</span></td><td>" + roleCell +
        '</td><td class="hub-num">' + H.credits(a.balance) + '</td><td class="hub-num">' + a.diskGb + "</td><td>" + esc(a.engine.state) +
        (a.engine.error ? '<br><span class="hub-muted">' + esc(a.engine.error) + "</span>" : "") +
        "</td><td>" + (a.server_home ? '<span class="hub-muted">server</span>' : lent + '<button type="button" data-save-lend="' + esc(a.id) + '">' + H.t("save") + "</button>") +
        '</td><td><div class="hub-row"><button type="button" data-topup="' + esc(a.id) + '">' + H.t("topup") + "</button>" +
        (a.role !== "superadmin" ? '<button type="button" class="hub-danger" data-toggle="' + esc(a.id) + '">' + H.t(a.disabled ? "enable" : "disable") + "</button>" : "") +
        '<button type="button" data-restart="' + esc(a.id) + '">' + H.t("restart") + "</button></div></td></tr>";
    }).join("");
  }
  function loadAccounts() {
    return H.api("/_hub/api/admin/accounts").then(function (data) {
      state.me = data.me; state.accounts = data.accounts; state.permissions = data.permissions; state.lendable = data.lendable;
      renderAccounts();
      var ledgerSelect = $("ledger-account");
      ledgerSelect.innerHTML = '<option value="">*</option>' + data.accounts.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.username) + "</option>"; }).join("");
    }, fail);
  }
  function update(id, body) { return H.api("/_hub/api/admin/accounts/" + encodeURIComponent(id), body).then(loadAccounts, fail); }
  $("accounts").addEventListener("click", function (event) {
    var b = event.target, id;
    if ((id = b.getAttribute("data-topup"))) {
      var amount = window.prompt(H.t("topup") + " (" + H.t("credits") + ")", "100");
      if (amount) { H.api("/_hub/api/admin/accounts/" + encodeURIComponent(id) + "/topup", { credits: Number(amount) }).then(loadAccounts, fail); }
    } else if ((id = b.getAttribute("data-toggle"))) {
      var account = state.accounts.filter(function (a) { return a.id === id; })[0];
      update(id, { disabled: !account.disabled });
    } else if ((id = b.getAttribute("data-restart"))) {
      b.disabled = true;
      H.api("/_hub/api/admin/accounts/" + encodeURIComponent(id) + "/engine", { action: "restart" }).then(loadAccounts, fail);
    } else if ((id = b.getAttribute("data-save-lend"))) {
      var lent = Array.prototype.map.call(document.querySelectorAll('[data-lend="' + id + '"]:checked'), function (c) { return c.value; });
      update(id, { lent: lent });
    } else if ((id = b.getAttribute("data-save-role"))) {
      var role = document.querySelector('[data-role="' + id + '"]').value;
      var perms = Array.prototype.map.call(document.querySelectorAll('[data-perm="' + id + '"]:checked'), function (c) { return c.value; });
      update(id, { role: role, permissions: perms });
    }
  });
  $("create-form").addEventListener("submit", function (event) {
    event.preventDefault();
    H.api("/_hub/api/admin/accounts", { username: $("c-user").value, password: $("c-pass").value, role: $("c-role").value }).then(function () {
      $("c-user").value = ""; $("c-pass").value = ""; return loadAccounts();
    }, fail);
  });

  function loadPrices() {
    return H.api("/_hub/api/admin/prices").then(function (data) {
      $("prices").innerHTML = Object.keys(data.prices).map(function (model) {
        var p = data.prices[model];
        return '<tr data-model="' + esc(model) + '"><td><code>' + esc(model) + '</code></td><td><input type="number" step="any" min="0" value="' + p.input +
          '"></td><td><input type="number" step="any" min="0" value="' + p.output + '"></td><td><input type="number" step="any" min="0" value="' + p.cacheHit +
          '"></td><td class="hub-row"><button type="button" data-save>' + H.t("save") + '</button><button type="button" class="hub-danger" data-remove>' + H.t("remove") + "</button></td></tr>";
      }).join("");
      $("r-rate").value = data.creditsPerUsd; $("r-own").value = data.ownShare; $("r-lent").value = data.lentShare;
      $("unpriced").textContent = data.unpriced.length ? H.t("unpriced") + " " + data.unpriced.join(", ") : "";
    }, fail);
  }
  $("prices").addEventListener("click", function (event) {
    var row = event.target.closest("tr");
    if (!row) { return; }
    var model = row.getAttribute("data-model");
    if (event.target.hasAttribute("data-remove")) {
      H.api("/_hub/api/admin/prices", { model: model, remove: true }).then(loadPrices, fail);
    } else if (event.target.hasAttribute("data-save")) {
      var inputs = row.querySelectorAll("input");
      H.api("/_hub/api/admin/prices", { model: model, input: Number(inputs[0].value), output: Number(inputs[1].value), cacheHit: Number(inputs[2].value) }).then(function () { ok(); return loadPrices(); }, fail);
    }
  });
  $("add-price").onclick = function () {
    H.api("/_hub/api/admin/prices", { model: $("n-model").value, input: Number($("n-in").value), output: Number($("n-out").value), cacheHit: Number($("n-hit").value || 0) }).then(function () {
      $("n-model").value = ""; $("n-in").value = ""; $("n-out").value = ""; $("n-hit").value = ""; return loadPrices();
    }, fail);
  };
  $("rate-form").addEventListener("submit", function (event) {
    event.preventDefault();
    H.api("/_hub/api/admin/settings", { credits_per_usd: Number($("r-rate").value), own_access_share: Number($("r-own").value), lent_access_share: Number($("r-lent").value) }).then(ok, fail);
  });

  function loadSettings() {
    return H.api("/_hub/api/admin/settings").then(function (data) {
      var s = data.settings;
      $("s-url").value = s.public_url; $("s-open").checked = s.registration_open; $("s-gid").value = s.google_client_id;
      $("s-gsecret").value = ""; $("s-gsecret").placeholder = s.google_client_secret_set ? "••••••••" : "";
      $("s-redirect").textContent = (s.public_url || "https://<public address>") + "/_hub/google/callback";
      $("s-disk").value = s.disk_quota_gb; $("s-new").value = s.new_account_credits;
    }, fail);
  }
  $("settings-form").addEventListener("submit", function (event) {
    event.preventDefault();
    H.api("/_hub/api/admin/settings", {
      public_url: $("s-url").value, registration_open: $("s-open").checked, google_client_id: $("s-gid").value,
      google_client_secret: $("s-gsecret").value, disk_quota_gb: Number($("s-disk").value), new_account_credits: Number($("s-new").value)
    }).then(function () { ok(); return loadSettings(); }, fail);
  });

  function loadAudit() {
    return H.api("/_hub/api/admin/audit").then(function (data) {
      $("audit").innerHTML = data.audit.map(function (row) {
        var detail = {}; Object.keys(row).forEach(function (k) { if (["ts", "actor", "action", "target"].indexOf(k) < 0) { detail[k] = row[k]; } });
        return "<tr><td>" + H.when(row.ts) + "</td><td>" + esc(row.actor) + "</td><td>" + esc(row.action) + "</td><td>" + esc(row.target) +
          '</td><td class="hub-muted">' + esc(Object.keys(detail).length ? JSON.stringify(detail) : "") + "</td></tr>";
      }).join("");
    }, fail);
  }
  function loadLedger() {
    var account = $("ledger-account").value;
    return H.api("/_hub/api/admin/ledger" + (account ? "?account=" + encodeURIComponent(account) : "")).then(function (data) {
      var n = names();
      $("ledger").innerHTML = data.ledger.map(function (row) {
        var what = row.kind === "topup" ? H.t("topup") + (row.actor ? " · " + esc(row.actor) : "") : esc(row.model) + (row.estimated ? ' <span class="hub-tag">' + H.t("estimated") + "</span>" : "") + ' <span class="hub-muted">×' + row.share + "</span>";
        return "<tr><td>" + H.when(row.ts) + "</td><td>" + esc(n[row.account] || row.account) + "</td><td>" + what + '</td><td class="hub-num">' + H.credits(row.credits) + '</td><td class="hub-num">' + H.credits(row.balance) + "</td></tr>";
      }).join("");
    }, fail);
  }
  $("ledger-account").onchange = loadLedger;

  var loaders = { accounts: loadAccounts, prices: loadPrices, settings: loadSettings, audit: loadAudit, ledger: loadLedger };
  function open(tab) {
    $("error").textContent = "";
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === tab)); });
    Object.keys(loaders).forEach(function (k) { $("tab-" + k).hidden = k !== tab; });
    loaders[tab]();
  }
  document.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { open(b.getAttribute("data-tab")); }; });
  loadAccounts().then(function () { open("accounts"); });
})();
</script>
</body>
</html>
