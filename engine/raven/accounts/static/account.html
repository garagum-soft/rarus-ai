<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raven</title>
<link rel="stylesheet" href="/_hub/static/hub.css" />
</head>
<body>
<div class="hub-wide">
  <div class="hub-row" style="justify-content: space-between">
    <h1><span data-i18n="account">Account</span> · <span id="name"></span></h1>
    <div class="hub-row">
      <a href="/" data-i18n="back">Back to Raven</a>
      <a href="/_hub/admin" id="admin-link" data-i18n="admin" hidden>Admin</a>
      <button type="button" id="logout" data-i18n="signout">Sign out</button>
    </div>
  </div>

  <section class="hub-panel">
    <div class="hub-row" style="gap: 32px">
      <div><div class="hub-muted" data-i18n="balance">Balance</div><div style="font-size: 26px"><span id="balance"></span> <span class="hub-muted" data-i18n="credits">credits</span></div></div>
      <div><div class="hub-muted" data-i18n="disk">Disk</div><div style="font-size: 20px" id="disk"></div></div>
      <div><div class="hub-muted" data-i18n="engine">Engine</div><div id="engine"></div></div>
    </div>
    <p class="hub-note" id="blocked" hidden></p>
  </section>

  <section class="hub-panel">
    <h2 data-i18n="history">History</h2>
    <div class="hub-scroll"><table><thead><tr><th data-i18n="when">When</th><th data-i18n="what">What</th><th class="hub-num" data-i18n="credits">credits</th><th class="hub-num" data-i18n="balance">Balance</th></tr></thead><tbody id="ledger"></tbody></table></div>
  </section>

  <section class="hub-panel">
    <h2 data-i18n="password">Password</h2>
    <form id="password-form" style="max-width: 360px">
      <label for="p-cur" data-i18n="currentPassword">Current password</label>
      <input id="p-cur" type="password" autocomplete="current-password" />
      <label for="p-new" data-i18n="newPassword">New password</label>
      <input id="p-new" type="password" autocomplete="new-password" minlength="8" required />
      <div class="hub-actions"><button class="hub-primary" type="submit" data-i18n="change">Change</button></div>
    </form>
    <div class="hub-actions" id="google-row"></div>
    <div class="hub-error" id="error" role="alert"></div>
  </section>
</div>
<script src="/_hub/static/hub.js"></script>
<script>
(function () {
  "use strict";
  var H = window.RavenHub;
  var $ = function (id) { return document.getElementById(id); };
  function fail(error) {
    if (error.status === 401) { window.location.href = "/_hub/login"; return; }
    $("error").textContent = error.message || String(error);
  }
  function describe(row) {
    if (row.kind === "topup") { return H.t("topup") + (row.actor ? " · " + H.esc(row.actor) : "") + (row.note ? " · " + H.esc(row.note) : ""); }
    var tokens = row.tokens || {};
    return H.esc(row.model) + (row.estimated ? ' <span class="hub-tag">' + H.t("estimated") + "</span>" : "") +
      ' <span class="hub-muted">' + (tokens.input || 0) + "/" + (tokens.output || 0) + (tokens.cacheRead ? "/" + tokens.cacheRead : "") +
      " · ×" + row.share + "</span>";
  }
  function load() {
    H.api("/_hub/api/me").then(function (data) {
      var me = data.me;
      $("name").textContent = me.display_name || me.username;
      $("balance").textContent = H.credits(me.balance);
      $("disk").textContent = data.diskGb + (data.diskQuotaGb ? " / " + data.diskQuotaGb : "") + " GB";
      $("engine").textContent = data.engine.state;
      $("admin-link").hidden = !(me.role === "superadmin" || me.role === "admin");
      $("blocked").hidden = !data.blocked;
      $("blocked").textContent = data.blocked ? H.t("blocked") + ": " + data.blocked : "";
      $("ledger").innerHTML = data.ledger.map(function (row) {
        return "<tr><td>" + H.when(row.ts) + "</td><td>" + describe(row) + '</td><td class="hub-num">' + H.credits(row.credits) +
          '</td><td class="hub-num">' + H.credits(row.balance) + "</td></tr>";
      }).join("");
      $("google-row").innerHTML = me.google_linked
        ? '<span class="hub-tag">' + H.t("googleLinked") + "</span>"
        : '<a href="/_hub/google/start"><button type="button">' + H.t("linkGoogle") + "</button></a>";
      H.api("/_hub/api/state").then(function (state) { if (!state.google && !me.google_linked) { $("google-row").innerHTML = ""; } });
    }, fail);
  }
  $("password-form").addEventListener("submit", function (event) {
    event.preventDefault();
    H.api("/_hub/api/password", { current: $("p-cur").value, password: $("p-new").value }).then(function () {
      $("error").innerHTML = '<span class="hub-ok">' + H.t("saved") + "</span>";
      $("p-cur").value = ""; $("p-new").value = "";
    }, fail);
  });
  $("logout").onclick = function () { H.api("/_hub/api/logout", {}).then(function () { window.location.href = "/_hub/login"; }, fail); };
  load();
})();
</script>
</body>
</html>
